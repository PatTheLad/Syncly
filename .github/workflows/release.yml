name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # upload-artifact / download-artifact v4+ use the actions API; contents: write alone is not enough.
  actions: write

env:
  DOTNET_NOLOGO: true
  VERSION: 2.0.${{ github.run_number }}
  ANDROID_VERSION_CODE: ${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test Syncly.slnx -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/Syncly.UI.Tests/package-lock.json
      - run: npm ci
        working-directory: tests/Syncly.UI.Tests
      - run: npm run vendor:check
        working-directory: tests/Syncly.UI.Tests
      - run: npm run test:unit
        working-directory: tests/Syncly.UI.Tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests/Syncly.UI.Tests
      - run: npm run test:e2e
        working-directory: tests/Syncly.UI.Tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool install --global vpk --version 1.2.0
      - run: >
          dotnet publish src/Syncly.Desktop/Syncly.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:PublishSingleFile=false
          -o publish/win
      - run: >
          vpk pack
          -u Syncly
          -v ${{ env.VERSION }}
          -p publish/win
          -e Syncly.exe
          -o dist/win
          --channel win
          --packTitle Syncly
          --icon src/Syncly.Desktop/Assets/app.ico
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/win

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: dotnet tool install --global vpk --version 1.2.0
      - run: >
          dotnet publish src/Syncly.Desktop/Syncly.Desktop.csproj
          -c Release -r linux-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:PublishSingleFile=false
          -o publish/linux
      - run: >
          vpk pack
          -u Syncly
          -v ${{ env.VERSION }}
          -p publish/linux
          -e Syncly
          -o dist/linux
          --channel linux
          --packTitle Syncly
      - name: Build .deb package
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick
          pkgdir="dist/deb/syncly_${VERSION}_amd64"
          rm -rf "$pkgdir"
          mkdir -p "$pkgdir/DEBIAN" "$pkgdir/usr/lib/syncly" "$pkgdir/usr/bin" \
            "$pkgdir/usr/share/applications" "$pkgdir/usr/share/icons/hicolor/256x256/apps"
          cp -r publish/linux/. "$pkgdir/usr/lib/syncly/"
          chmod +x "$pkgdir/usr/lib/syncly/Syncly"
          ln -s /usr/lib/syncly/Syncly "$pkgdir/usr/bin/syncly"
          convert src/Syncly.Desktop/Assets/app.ico -resize 256x256 \
            "$pkgdir/usr/share/icons/hicolor/256x256/apps/syncly.png"
          cat > "$pkgdir/usr/share/applications/syncly.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Syncly
          Comment=Local-first, end-to-end encrypted notes and sync
          Exec=/usr/bin/syncly
          Icon=syncly
          Categories=Office;
          Terminal=false
          DESKTOP
          size=$(du -sk "$pkgdir/usr" | cut -f1)
          cat > "$pkgdir/DEBIAN/control" <<CONTROL
          Package: syncly
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${size}
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
          Maintainer: PatTheLad <github.boastful839@passmail.net>
          Description: Syncly desktop app
           Syncly is a local-first, end-to-end encrypted notes and sync app.
          CONTROL
          dpkg-deb --build --root-owner-group "$pkgdir" "dist/linux/Syncly-${VERSION}-linux-x64.deb"
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/linux

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Default packages include the obsolete `tools` package Google removed;
      # sdkmanager then exits 1 with "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: dotnet workload install maui-android
      # Android refuses to replace an installed app unless the new APK is signed with the
      # same certificate. A fresh debug.keystore on each runner made every release look
      # like a different app, so the system installer reported "App not installed".
      # Required repo secrets: ANDROID_KEYSTORE_BASE64 (base64 of a PKCS12 file whose
      # alias is `syncly`) and ANDROID_KEYSTORE_PASSWORD.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD as repository secrets. Generating a new debug keystore per build makes Android reject in-place updates."
            exit 1
          fi
          # Strip whitespace/newlines from the pasted secret before decoding.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/syncly-release.keystore"
          test -s "$RUNNER_TEMP/syncly-release.keystore"
          # Same file for StorePass + KeyPass must be two lines (store then key).
          # See: https://learn.microsoft.com/dotnet/android/deployment/publishing
          {
            printf '%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf '%s\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > "$RUNNER_TEMP/syncly-keystore.pass"
          # Fail early with a clear message if alias/password/base64 are wrong.
          STORE_PASS=$(sed -n '1p' "$RUNNER_TEMP/syncly-keystore.pass")
          if ! keytool -list \
              -keystore "$RUNNER_TEMP/syncly-release.keystore" \
              -storepass "$STORE_PASS" \
              -alias syncly >/dev/null; then
            echo "::error::Could not open the release keystore. Check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and that the key alias is exactly 'syncly'."
            keytool -list -keystore "$RUNNER_TEMP/syncly-release.keystore" -storepass "$STORE_PASS" || true
            exit 1
          fi
          unset STORE_PASS
      - name: Publish Android APK
        run: |
          set -euo pipefail
          # Resolve paths relative to the Mobile project — MSBuild looks there, not $PWD.
          cp "$RUNNER_TEMP/syncly-release.keystore" src/Syncly.Mobile/syncly-release.keystore
          cp "$RUNNER_TEMP/syncly-keystore.pass" src/Syncly.Mobile/syncly-keystore.pass
          dotnet publish src/Syncly.Mobile/Syncly.Mobile.csproj \
            -c Release -f net10.0-android \
            -p:Version="${VERSION}" \
            -p:AndroidVersionCode="${ANDROID_VERSION_CODE}" \
            -p:AndroidPackageFormat=apk \
            -p:AndroidCreatePackagePerAbi=false \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=syncly-release.keystore \
            -p:AndroidSigningKeyAlias=syncly \
            -p:AndroidSigningKeyPass=file:syncly-keystore.pass \
            -p:AndroidSigningStorePass=file:syncly-keystore.pass
          rm -f src/Syncly.Mobile/syncly-release.keystore src/Syncly.Mobile/syncly-keystore.pass
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist/android
          find src/Syncly.Mobile -name "*.apk" -print
          apk=$(find src/Syncly.Mobile -name "dev.syncly.app-Signed.apk" | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find src/Syncly.Mobile -name "*-Signed.apk" | grep -vE -- '-(arm64-v8a|armeabi-v7a|x86|x86_64)-Signed\.apk$' | head -n 1)
          fi
          if [ -z "$apk" ]; then
            apk=$(find src/Syncly.Mobile -name "*-Signed.apk" | head -n 1)
          fi
          test -n "$apk"
          cp "$apk" dist/android/Syncly-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: dist/android

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mapfile -t files < <(find artifacts -type f | sort)
          test "${#files[@]}" -gt 0
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" \
              --title "Syncly ${VERSION}" \
              --notes "Installers for Windows, Linux, and Android. Installed copies show an Update button for the next release; the download is silent. Android users who already have a copy signed with an older CI debug key need to uninstall once, then later in-app updates install over the app." \
              --latest \
              "${files[@]}"
          fi

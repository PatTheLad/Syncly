<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syncly graph renderer fixture</title>
  <link rel="stylesheet" href="/src/Syncly.UI/wwwroot/css/app.css">
  <link rel="stylesheet" href="/src/Syncly.UI/wwwroot/css/graph.css">
  <style>body { margin: 0; } #fixture { height: 100dvh; } #galaxy-canvas { display: block; width: 100%; height: 100%; touch-action: none; } .fixture-stage { position: relative; min-width: 0; min-height: 0; height: 100%; }</style>
</head>
<body>
  <main id="fixture"><div class="fixture-stage"><canvas id="galaxy-canvas" tabindex="0" aria-label="Note connections"></canvas></div></main>
  <script type="module">
    import * as graph from '/src/Syncly.UI/wwwroot/js/galaxy.mjs';
    window.graph = graph;
    window.events = [];
    graph.mount('galaxy-canvas', { invokeMethodAsync(method, ...args) { window.events.push({ method, args }); return Promise.resolve(); } });
    window.loadFixture = (count = 40, spaceKey = 'test') => {
      const titles = ['Projects', 'Field notes', 'Design systems', 'Small experiments', 'Reading list', 'Research journal', 'The shape of an idea', 'Next steps', 'Weekly review', 'Open questions'];
      const nodes = Array.from({ length: count }, (_, index) => ({ id: `note-${index}`, title: index < titles.length ? titles[index] : `Research note ${index}`,
        missing: index === 9, parentId: index === 1 ? 'note-0' : null, updatedAt: index < 4 ? Date.now() : 0 }));
      const edges = [];
      for (let index = 1; index < count; index++) {
        if (index % 13 === 0) continue;
        edges.push({ from: `note-${Math.floor(index / 8) * 8}`, to: `note-${index}` });
        if (index % 3 === 0) edges.push({ from: `note-${index}`, to: `note-${Math.max(0, index - 2)}` });
      }
      if (count > 1) edges.push({ from: 'note-1', to: 'note-0' });
      const data = { spaceKey, currentId: 'note-0', nodes, edges };
      graph.update('galaxy-canvas', data);
      window.data = data;
    };
    window.loadFixture();
  </script>
</body>
</html>
